<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="墨灵">
<title>墨灵 · AI 小说工作台</title>
<style>
:root{
  --bg:#0d0e12;--elev:#15171e;--elev2:#1c1f28;--bd:#2a2e3a;
  --tx:#e8e5df;--dim:#8f8c86;--faint:#5a5750;
  --ac:#c9a96a;--acd:#8a7344;--acbg:#2a2418;
  --danger:#d16b5a;--ok:#6ba368;
  --tab-h:58px;
  --serif:"Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);
  -webkit-font-smoothing:antialiased;text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:15px}
input,textarea,select{font-family:inherit;background:var(--elev2);border:1px solid var(--bd);
  color:var(--tx);border-radius:10px;padding:12px 13px;font-size:16px;outline:none;width:100%;
  -webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--acd)}
textarea{resize:none;line-height:1.7}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
  linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:36px}
::-webkit-scrollbar{width:0;height:0}

/* ========= 启动页 ========= */
#land{height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:radial-gradient(ellipse at 50% 32%,#1a1c24,#0d0e12 72%);
  padding:0 26px calc(48px + env(safe-area-inset-bottom))}
.land-title{font-family:var(--serif);font-size:clamp(46px,14vw,58px);letter-spacing:12px;
  margin-bottom:10px;color:var(--tx)}
.land-sub{font-size:13px;color:var(--dim);letter-spacing:3px;margin-bottom:52px}
.land-btn{width:100%;max-width:300px;font-size:17px;letter-spacing:6px;padding:18px 0;
  border:1px solid var(--acd);border-radius:44px;color:var(--ac);background:var(--acbg);
  transition:transform .12s,background .15s}
.land-btn:active{transform:scale(.96);background:var(--ac);color:#151209}
.land-tip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));
  font-size:11px;color:var(--faint);text-align:center;line-height:1.8;padding:0 30px}

/* ========= 应用外壳 ========= */
#shell{height:100%;height:100dvh;display:flex;flex-direction:column}
.hdr{flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--elev);border-bottom:1px solid var(--bd)}
.hdr .brand{font-family:var(--serif);font-size:19px;letter-spacing:4px;color:var(--ac);flex-shrink:0}
.hdr .h-title{flex:1;text-align:right;font-size:12.5px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .h-back{font-size:26px;line-height:1;color:var(--dim);padding:0 10px 0 0;flex-shrink:0}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 14px calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px)}

/* ========= 底部标签栏 ========= */
.tabbar{flex-shrink:0;display:flex;background:var(--elev);border-top:1px solid var(--bd);
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--faint);font-size:10px;letter-spacing:.5px;padding-top:6px;transition:color .15s}
.tab .ti{font-size:19px;line-height:1}
.tab.on{color:var(--ac)}

/* 阅读模式隐藏标签栏 */
#shell.reader .tabbar{display:none}
#shell.reader .main{padding-bottom:calc(24px + env(safe-area-inset-bottom))}

/* ========= 通用组件 ========= */
.v-head{margin-bottom:18px}
.v-title{font-family:var(--serif);font-size:23px;letter-spacing:.5px;line-height:1.35}
.v-desc{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.6}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 16px;border-radius:10px;font-size:14.5px;background:var(--elev2);
  border:1px solid var(--bd);color:var(--tx);min-height:46px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--ac);border-color:var(--ac);color:#151209;font-weight:600}
.btn-p:disabled{opacity:.4}
.btn-b{width:100%}
.btn-danger{color:var(--danger);border-color:#3a2520}
.btn-row{display:flex;gap:9px;margin-top:13px}
.btn-row .btn{flex:1;min-width:0}

.card{background:var(--elev);border:1px solid var(--bd);border-radius:14px;
  padding:17px 15px;margin-bottom:13px}
.card-title{font-size:12.5px;color:var(--ac);letter-spacing:.5px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.stat{background:var(--elev);border:1px solid var(--bd);border-radius:12px;padding:14px 15px}
.stat-num{font-family:var(--serif);font-size:25px;color:var(--ac);line-height:1.2}
.stat-label{font-size:11px;color:var(--dim);margin-top:4px}

.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}

.char-card{background:var(--elev2);border:1px solid var(--bd);border-radius:11px;
  padding:13px;margin-bottom:9px}
.char-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.char-name{font-family:var(--serif);font-size:16.5px}
.char-role{font-size:10.5px;padding:3px 10px;border-radius:20px;background:var(--acbg);
  color:var(--ac);flex-shrink:0}
.char-role.antagonist{background:#2e1a17;color:var(--danger)}
.char-meta{font-size:12.5px;color:var(--dim);line-height:1.85}
.char-meta span{color:var(--faint)}

.chapter-row{display:flex;align-items:center;gap:11px;background:var(--elev);
  border:1px solid var(--bd);border-radius:12px;padding:14px 15px;margin-bottom:8px;
  min-height:56px;transition:transform .1s,border-color .15s}
.chapter-row:active{transform:scale(.985);border-color:var(--acd)}
.chapter-num{font-family:var(--serif);font-size:12.5px;color:var(--faint);flex-shrink:0}
.chapter-name{flex:1;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chapter-st{font-size:10.5px;padding:3px 9px;border-radius:20px;flex-shrink:0}
.st-done{background:#1a2a1a;color:var(--ok)}
.st-empty{background:var(--elev2);color:var(--faint)}

.prose{font-family:var(--serif);font-size:16px;line-height:2.05;color:#ddd9d1;
  letter-spacing:.2px;white-space:pre-wrap;word-break:break-word}
.prose:empty::before{content:"尚未生成正文，点击上方「生成草稿」开始。";
  color:var(--faint);font-family:var(--sans);font-size:13px;line-height:1.9}

.review-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--bd)}
.review-item:last-child{border-bottom:none;padding-bottom:0}
.review-score{font-family:var(--serif);font-size:20px;width:32px;flex-shrink:0;text-align:center}
.review-dim{font-size:13px;margin-bottom:4px}
.review-ev{font-size:12px;color:var(--dim);line-height:1.7}

.badge{display:inline-block;font-size:10.5px;padding:3px 10px;border-radius:20px;
  background:var(--elev2);color:var(--dim);white-space:nowrap}
.badge-ok{background:#1a2a1a;color:var(--ok)}
.badge-warn{background:#2e2418;color:var(--ac)}

.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--acd);
  border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.empty-state{text-align:center;padding:40px 18px;color:var(--faint);font-size:13px;line-height:1.9}

.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%);background:var(--elev2);border:1px solid var(--bd);color:var(--tx);
  padding:12px 22px;border-radius:24px;font-size:13px;z-index:300;max-width:86vw;text-align:center;
  box-shadow:0 8px 30px #000a;animation:tin .18s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

.note{background:var(--acbg);border:1px solid #3a3220;border-radius:10px;padding:11px 13px;
  font-size:12px;color:var(--ac);line-height:1.75;margin-bottom:13px}
.note b{color:#e0c890}

/* ========= 平板/桌面微调 ========= */
@media (min-width:720px){
  .main{max-width:720px;margin:0 auto;width:100%;padding:26px 28px 40px}
  .tabbar{max-width:720px;margin:0 auto;width:100%;border-left:1px solid var(--bd);
    border-right:1px solid var(--bd)}
  .hdr{max-width:720px;margin:0 auto;width:100%}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ===================== 基础工具 ===================== */
const R = document.getElementById('root');
const uid = () => 'i' + Math.random().toString(36).slice(2, 10);
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 1700);
  setTimeout(() => t.remove(), 2100);
}

/* ===================== 生成引擎 ===================== */
function makeCast(gk) {
  const g = G[gk] || G.xianxia;
  const used = new Set();
  const name = () => {
    for (let i = 0; i < 40; i++) {
      const n = pick(g.sur) + pick(g.giv);
      if (!used.has(n)) { used.add(n); return n; }
    }
    return pick(g.sur) + pick(g.giv) + '之';
  };
  return [
    { role: 'protagonist', label: '主角' },
    { role: 'ally', label: '盟友' },
    { role: 'antagonist', label: '对手' },
    { role: 'mentor', label: '引路人' }
  ].map(r => ({
    id: uid(), name: name(), role: r.role, label: r.label,
    status: 'active', trait: pick(g.trt), goal: pick(g.gol)
  }));
}

function makeOutline(gk, n) {
  const g = G[gk] || G.xianxia;
  const titles = ['风起','旧约','夜行','断线','来客','暗涌','归途','裂痕','霜降','回声','错位','临界','余烬','孤灯'];
  const arr = [];
  for (let i = 1; i <= n; i++) {
    arr.push({
      id: uid(), num: i, title: titles[(i - 1) % titles.length],
      plan: `第${i}章围绕${pick(g.gol)}展开。${pick(g.atm)}，主角在${pick(g.plc)}遭遇新的阻碍，${pick(g.cfl).replace('{A}', '对手')}本章需推进主线并留下悬念。`,
      text: '', review: null, status: 'empty'
    });
  }
  return arr;
}

function genText(p, ch) {
  const g = G[p.genre] || G.xianxia;
  const cast = p.bible.cast;
  const A = cast.find(c => c.role === 'protagonist') || cast[0];
  const B = cast.find(c => c.role === 'ally') || cast[1] || cast[0];
  const C = cast.find(c => c.role === 'antagonist') || cast[2] || cast[1] || cast[0];
  const d1 = pick(g.dia);
  const d2 = pick(g.dia.filter(x => x !== d1));
  return [
    `${pick(g.atm)}。${A.name}独自${pick(['立在','站在','坐在','行至'])}${pick(g.plc)}，${pick(g.act)}。`,
    `${pick(g.tho)}他伸手摸到${pick(g.art)}，${pick(['指尖停了一瞬','又缓缓收了回来','却始终没有握紧'])}。`,
    `${B.name}走近时，脚步声在空旷里格外清晰。\n\n「${d1}」\n\n${A.name}${pick(['没有回头','侧过脸','顿了顿'])}。\n\n「${d2}」`,
    pick(g.cfl).replace('{A}', C.name),
    pick(g.hok)
  ].join('\n\n');
}

function makeReview() {
  const dims = [
    ['setting', '设定一致性'], ['character', '人物行为'],
    ['pacing', '节奏'], ['hook', '伏笔处理'], ['prose', '文笔']
  ];
  const items = dims.map(([k, l]) => {
    const s = 6 + Math.floor(Math.random() * 4);
    return {
      k, l, s,
      e: s >= 8
        ? '符合本章计划，未发现与故事圣经冲突之处。'
        : '存在可优化空间：部分描述与人物既有设定略有偏差，建议复核。'
    };
  });
  const avg = items.reduce((a, x) => a + x.s, 0) / items.length;
  return { items, avg: Math.round(avg * 10) / 10, ok: avg >= 7.5 };
}

/* ===================== 真实 API 调用 ===================== */
async function liveGen(p, ch, onDelta) {
  const c = S.cfg;
  if (!c.key) throw new Error('尚未配置 API Key，请到「设置」里填写');

  const castLines = p.bible.cast.map(x =>
    `- ${x.name}（${x.label}，${x.trait}，目标：${x.goal}，状态：${x.status}）`
  ).join('\n');

  const sys = `你是中文小说写作助手，为《${p.title}》写第${ch.num}章。
题材：${G[p.genre]?.label || p.genre}
设定：${p.pitch}

【人物】
${castLines}

【硬约束】
- 已死亡角色不得出场
- 不得让角色知道信息边界外的事
- 字数 1500–2200
- 结尾落在未解决的张力上

【本章计划】
${ch.plan || '（无）'}

直接输出正文，不要标题和解释。`;

  const hosted = /^https?:$/.test(location.protocol);
  const url = hosted ? '/api/chat' : c.base.replace(/\/$/, '') + '/chat/completions';
  const body = hosted
    ? { apiBase: c.base, apiKey: c.key, model: c.model,
        messages: [{ role: 'system', content: sys }, { role: 'user', content: '开始写。' }] }
    : { model: c.model, stream: true, temperature: 0.85,
        messages: [{ role: 'system', content: sys }, { role: 'user', content: '开始写。' }] };

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`接口返回 ${res.status}`);

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const payload = t.slice(5).trim();
      if (payload === '[DONE]') continue;
      try {
        const j = JSON.parse(payload);
        const d = j.choices?.[0]?.delta?.content || '';
        if (d) { full += d; onDelta(d, full); }
      } catch (e) {}
    }
  }
  return full;
}

/* ===================== 应用外壳 ===================== */
function render() {
  if (S.view === 'land') { renderLanding(); return; }
  const p = cur();
  if (!p) { S.view = 'land'; renderLanding(); return; }

  const reader = S.view === 'chapter';
  const chObj = p.chapters.find(c => c.id === S.ch);
  const headerTitle = reader ? `第${chObj ? chObj.num : ''}章` : p.title;

  const tabs = [
    ['dash', '工作台', '◈'],
    ['bible', '圣经', '❖'],
    ['chapters', '章节', '▤'],
    ['cfg', '设置', '⚙']
  ];

  R.innerHTML = `
    <div id="shell" class="${reader ? 'reader' : ''}">
      <header class="hdr">
        ${reader ? '<button class="h-back" id="backBtn">‹</button>' : ''}
        <div class="brand">墨灵</div>
        <div class="h-title">${esc(headerTitle)}</div>
      </header>
      <main class="main" id="main"></main>
      <nav class="tabbar">
        ${tabs.map(([v, l, i]) => `
          <button class="tab ${!reader && S.view === v ? 'on' : ''}" data-nav="${v}">
            <span class="ti">${i}</span><span>${l}</span>
          </button>`).join('')}
      </nav>
    </div>`;

  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.onclick = () => {
      S.view = btn.dataset.nav;
      S.ch = null;

  });
  const back = document.getElementById('backBtn');
  if (back) back.onclick = () => { S.view = 'chapters'; render(); };

  paintMain(p);
}

function paintMain(p) {
  const m = document.getElementById('main');
  if (!m) return;
  if (S.view === 'dash')     m.innerHTML = viewDash(p);
  if (S.view === 'bible')    m.innerHTML = viewBible(p);
  if (S.view === 'chapters') m.innerHTML = viewChapters(p);
  if (S.view === 'chapter')  m.innerHTML = viewChapter(p);
  if (S.view === 'cfg')      m.innerHTML = viewCfg();
  bindEvents(p);
}

/* ===================== 事件绑定 ===================== */
function bindEvents(p) {
  const m = document.getElementById('main');
  if (!m) return;
  const q = s => m.querySelector(s);

  const qw = q('#quickWrite');
  if (qw) qw.onclick = () => {
    const n = p.chapters.find(c => c.status !== 'done');
    if (n) { S.ch = n.id; S.view = 'chapter'; render(); }
  };

  m.querySelectorAll('[data-open]').forEach(el => {
    el.onclick = () => { S.ch = el.dataset.open; S.view = 'chapter'; render(); };
  });

  const addCh = q('#addCh');
  if (addCh) addCh.onclick = () => {
    const start = p.chapters.length + 1;
    p.chapters.push(...makeOutline(p.genre, 3).map((c, i) => ({ ...c, num: start + i })));
    save(); toast('已增加 3 章'); render();
  };

  const saveInfo = q('#saveInfo');
  if (saveInfo) saveInfo.onclick = () => {
    p.title = q('#bTitle').value.trim() || p.title;
    p.pitch = q('#bPitch').value.trim();
    p.bible.world = q('#bWorld').value.trim();
    save(); toast('作品信息已保存'); render();
  };

  const saveCast = q('#saveCast');
  if (saveCast) saveCast.onclick = () => {
    p.bible.cast.forEach(c => {
      const t = q(`[data-trait="${c.id}"]`);
      const g = q(`[data-goal="${c.id}"]`);
      const s = q(`[data-status="${c.id}"]`);
      if (t) c.trait = t.value.trim();
      if (g) c.goal = g.value.trim();
      if (s) c.status = s.value;
    });
    save(); toast('人物台账已保存'); render();
  };

  const planBox = q('#planBox');
  if (planBox) planBox.oninput = () => {
    const c = p.chapters.find(x => x.id === S.ch);
    if (c) { c.plan = planBox.value; save(); }
  };

  const genBtn = q('#genBtn');
  if (genBtn) genBtn.onclick = () => doGenerate(p);

  const reviewBtn = q('#reviewBtn');
  if (reviewBtn) reviewBtn.onclick = () => doReview(p);

  const exportBtn = q('#exportBtn');
  if (exportBtn) exportBtn.onclick = () => doExport(p);

  const saveCfg = q('#saveCfg');
  if (saveCfg) saveCfg.onclick = () => {
    S.cfg.mode = q('#cfgMode').value;
    S.cfg.base = q('#cfgBase').value.trim();
    S.cfg.key = q('#cfgKey').value.trim();
    S.cfg.model = q('#cfgModel').value.trim();
    save(); toast('设置已保存');
  };

  const resetAll = q('#resetAll');
  if (resetAll) resetAll.onclick = () => {
    if (!confirm('将清空所有作品与设置，确定继续？')) return;
    localStorage.removeItem(STORE_KEY);
    S.projects = []; S.active = null; S.view = 'land';
    render();
  };
}

/* ===================== 动作：生成 ===================== */
async function doGenerate(p) {
  const c = p.chapters.find(x => x.id === S.ch);
  if (!c) return;
  const btn = document.getElementById('genBtn');
  const box = document.getElementById('proseBox');
  if (!btn || !box) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>生成中';
  c.review = null;

  try {
    if (S.cfg.mode === 'live') {
      box.textContent = '';
      const full = await liveGen(p, c, (d, acc) => { box.textContent = acc; });
      c.text = full.trim();
    } else {
      box.textContent = '';
      const text = genText(p, c);
      for (let i = 0; i < text.length; i += 10) {
        box.textContent = text.slice(0, i + 10);
        await sleep(14);
      }
      c.text = text;
    }
    c.status = 'done';
    save();
    toast('草稿已生成');
  } catch (err) {
    console.error(err);
    toast('生成失败：' + err.message);
  } finally {
    render();
  }
}

/* ===================== 动作：评审 ===================== */
function doReview(p) {
  const c = p.chapters.find(x => x.id === S.ch);
  if (!c || !c.text) return;

  const dead = p.bible.cast.filter(x => x.status === 'dead').map(x => x.name);
  const bad = dead.filter(n => n && c.text.includes(n));

  const r = makeReview();
  if (bad.length) {
    r.items.unshift({
      k: 'hard', l: '硬性一致性检查', s: 2,
      e: `已死亡角色出现在正文中：${bad.join('、')}。必须修正。`
    });
    r.avg = Math.round(r.items.reduce((a, x) => a + x.s, 0) / r.items.length * 10) / 10;
    r.ok = false;
  }
  c.review = r;
  save();
  toast(bad.length ? '发现硬性冲突' : '评审完成');
  render();
}

/* ===================== 动作：导出 ===================== */
async function doExport(p) {
  const c = p.chapters.find(x => x.id === S.ch);
  if (!c || !c.text) return;

  const txt =
    `《${p.title}》\n\n第${c.num}章　${c.title}\n\n${c.text}\n\n` +
    `——\n本作品在「墨灵」中创作，包含 AI 辅助生成内容。\n`;

  if (navigator.share) {
    try {
      await navigator.share({ title: `${p.title} 第${c.num}章`, text: txt });
      return;
    } catch (e) {}
  }

  const url = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `${p.title}_第${c.num}章.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('已导出');
}

/* ===================== 启动 ===================== */
render();
</script>
</body>
</html>
